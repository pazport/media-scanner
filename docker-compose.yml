services:
  media-scanner:
    image: media-scanner:latest
    build: .
    container_name: media-scanner
    restart: unless-stopped
    # Must own the ./config folder on the host (default image user is 1000:1000).
    user: "1000:1000"
    environment:
      - TZ=Europe/London
    ports:
      - "3030:3030"
    volumes:
      - ./config:/config
